name: MoneyPrinter - Test und Video erstellen

on:
  push:
    paths:
      - ".github/workflows/moneyprinter.yml"
      - "Backend/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "video_request.json"
  workflow_dispatch:
    inputs:
      topic:
        description: "Video-Thema (z. B. Geschichte Kurdistans)"
        required: true
        type: string
      voice:
        description: "KI-Sprecherstimme (z. B. de_001 / de_002)"
        required: true
        default: "en_us_001"
        type: string
      language_prompt:
        description: "Optionale Anweisung zur Sprache / zum Skript"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[render]')
    name: Installation und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installiere Python-Abhängigkeiten
        run: uv sync --group dev
      - name: Führe Tests aus
        run: uv run pytest
      - name: Teste Wikimedia Commons Suche ohne API-Key
        continue-on-error: true
        run: |
          uv run python - <<'PY'
          import sys
          sys.path.insert(0, "Backend")
          from search import search_for_stock_videos
          for query in ("mountains", "forest"):
              found = search_for_stock_videos(query, it=5)
              print(query, len(found), [(m["type"], m["title"][:50]) for m in found[:3]])
              if found:
                  break
          else:
              raise RuntimeError("Wikimedia Commons unavailable or no reusable media found")
          PY
      - name: Teste echten Wikimedia Video-Download
        continue-on-error: true
        run: |
          uv run python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          from imageio_ffmpeg import get_ffmpeg_exe
          sys.path.insert(0, "Backend")
          from search import search_for_stock_videos
          from commons_download import download_media
          found = search_for_stock_videos("mountains", it=10)
          candidates = [m for m in found if m["type"] == "video"]
          if not candidates:
              candidates = found
          error_messages = []
          for media in candidates[:5]:
              try:
                  path = download_media(media)
                  subprocess.run([get_ffmpeg_exe(), "-v", "error", "-i", path,
                     "-frames:v", "1", "-f", "null", "-"],
                     check=True, capture_output=True, text=True, timeout=30)
                  print("Valid video downloaded:", media["title"], Path(path).stat().st_size)
                  break
              except Exception as err:
                  error_messages.append(str(err))
          else:
              raise RuntimeError("Could not download a playable media file: " + "; ".join(error_messages))
          PY
      - name: Teste eine echte deutsche KI-Stimme (ohne Login)
        continue-on-error: true
        run: |
          uv run python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "Backend")
          from speech import tts
          tts("Hallo, dies ist ein Test.", "de_001", "smoke-voice.mp3")
          assert Path("smoke-voice.mp3").stat().st_size > 1000
          print("Deutsche Stimme erfolgreich erstellt.")
          PY

  render:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[render]'))
    name: Short rendern (MP4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_MODEL: "qwen2.5:1.5b"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      DATABASE_URL: "sqlite:///moneyprinter.db"
      VIDEO_TOPIC: ${{ inputs.topic }}
      VIDEO_VOICE: ${{ inputs.voice }}
      VIDEO_LANGUAGE_PROMPT: ${{ inputs.language_prompt }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lade Videowunsch aus GitHub-Datei
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path("video_request.json").read_text(encoding="utf-8"))
          fields = {
              "topic": ("VIDEO_TOPIC", ""),
              "voice": ("VIDEO_VOICE", "en_us_001"),
              "language_prompt": ("VIDEO_LANGUAGE_PROMPT", ""),
          }
          if not str(request.get("topic", "")).strip():
              raise ValueError("video_request.json braucht ein Video-Thema")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, (environment_name, default) in fields.items():
                  value = str(request.get(name) or default).replace("\r", " ").replace("\n", " ")
                  f.write(f"{environment_name}={value}\n")
          PY
      - name: Installiere FFmpeg und ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick espeak-ng
      - name: Installiere Python-Abhängigkeiten
        run: uv sync
      - name: Starte Ollama mit kleinem Modell
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"
      - name: Erstelle Video mit MoneyPrinter
        shell: bash
        run: |
          uv run python - <<'PY'
          import os, sys
          sys.path.insert(0, "Backend")
          from dotenv import load_dotenv
          load_dotenv(override=False)
          from pipeline import run_generation_pipeline

          topic = os.environ["VIDEO_TOPIC"]
          voice = os.environ["VIDEO_VOICE"] or "en_us_001"
          instruction = os.environ["VIDEO_LANGUAGE_PROMPT"].strip()
          data = {
              "videoSubject": topic,
              "aiModel": os.environ["OLLAMA_MODEL"],
              "voice": voice,
              "paragraphNumber": 1,
              "customPrompt": instruction,
              "subtitlesPosition": "center,bottom",
              "color": "#FFFF00",
              "useMusic": False,
              "automateYoutubeUpload": False,
              "threads": 2,
          }
          output = run_generation_pipeline(
              data=data,
              is_cancelled=lambda: False,
              on_log=lambda message, level: print(f"[{level}] {message}"),
          )
          print(f"Video erstellt: {output}")
          PY
      - name: Fertiges Video als Download bereitstellen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinter-Video
          path: |
            output.mp4
            ATTRIBUTION.md
          if-no-files-found: error
          retention-days: 7
